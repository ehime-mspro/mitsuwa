<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テナントダッシュボード</title>
<style>
/* =========================================================
   リセット・ベース
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gray-50:  #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --gray-900: #111827;

  --green-50:  #ecfdf5;
  --green-100: #d1fae5;
  --green-600: #059669;
  --green-700: #047857;

  --red-50:   #fef2f2;
  --red-100:  #fee2e2;
  --red-600:  #dc2626;
  --red-700:  #b91c1c;

  --amber-50:  #fffbeb;
  --amber-100: #fef3c7;
  --amber-600: #d97706;
  --amber-700: #b45309;

  --blue-50:  #eff6ff;
  --blue-100: #dbeafe;
  --blue-600: #2563eb;
  --blue-700: #1d4ed8;

  --sky-50:  #f0f9ff;
  --sky-600: #0284c7;

  --shadow-sm: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.05);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Segoe UI', sans-serif;
  background: #eef2f7;
  color: var(--gray-800);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}

/* =========================================================
   ページ
   ========================================================= */
.page {
  max-width: 1360px;
  margin: 0 auto;
  padding: 28px 24px 48px;
}

.page-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--gray-700);
  letter-spacing: 0;
  margin-bottom: 28px;
}

/* =========================================================
   セクション
   ========================================================= */
.section { margin-bottom: 32px; }

.section-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.section-accent {
  width: 4px;
  height: 20px;
  border-radius: 2px;
  flex-shrink: 0;
}
.section-accent.teal   { background: var(--green-600); }
.section-accent.orange { background: #f59e0b; }

.section-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--gray-700);
  letter-spacing: .02em;
}

.section-divider {
  flex: 1;
  height: 1px;
  background: var(--gray-200);
}

/* =========================================================
   KPI グリッド
   ========================================================= */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.kpi-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 14px;
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s;
  position: relative;
  overflow: hidden;
}

.kpi-card:hover { box-shadow: var(--shadow-md); }

/* カードに上部アクセントライン */
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 14px 14px 0 0;
}

.kpi-card.kpi-vacant::before   { background: var(--amber-600); }
.kpi-card.kpi-expiring::before { background: var(--red-600); }
.kpi-card.kpi-inquiry::before  { background: var(--red-600); }
.kpi-card.kpi-work::before     { background: var(--blue-600); }

.kpi-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--gray-500);
  margin-bottom: 12px;
}

.kpi-number {
  font-size: 44px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.03em;
  margin-bottom: 8px;
}

.kpi-card.kpi-vacant   .kpi-number { color: var(--amber-600); }
.kpi-card.kpi-expiring .kpi-number { color: var(--red-600); }
.kpi-card.kpi-inquiry  .kpi-number { color: var(--red-600); }
.kpi-card.kpi-work     .kpi-number { color: var(--blue-600); }

.kpi-unit {
  font-size: 18px;
  font-weight: 600;
  margin-left: 4px;
  color: var(--gray-500);
  vertical-align: baseline;
}

.kpi-sub {
  font-size: 12px;
  color: var(--gray-400);
  line-height: 1.5;
}

.kpi-sub strong {
  color: var(--gray-600);
  font-weight: 600;
}

/* =========================================================
   実績：メインカード（全体合計）
   ========================================================= */
.summary-main {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 14px;
  padding: 22px 26px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}

.summary-main::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 14px 14px 0 0;
  background: var(--green-600);
}

.summary-main-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}

.summary-main-badge {
  display: inline-block;
  padding: 3px 12px;
  background: var(--gray-700);
  color: #fff;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
}

.summary-main-title {
  font-size: 13px;
  color: var(--gray-500);
  font-weight: 500;
}

.summary-main-grid {
  display: grid;
  grid-template-columns: 1fr 1px 1fr;
  gap: 0;
}

.summary-main-cell { padding: 0 24px; }
.summary-main-cell:first-child { padding-left: 0; }
.summary-main-cell:last-child  { padding-right: 0; }

.summary-main-label {
  font-size: 12px;
  color: var(--gray-500);
  font-weight: 500;
  margin-bottom: 6px;
}

.summary-main-value {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -.01em;
  color: var(--gray-900);
}

.summary-main-unit {
  font-size: 14px;
  font-weight: 500;
  margin-left: 4px;
  color: var(--gray-500);
}

.summary-main-breakdown {
  font-size: 11px;
  color: var(--gray-500);
  margin-top: 8px;
  letter-spacing: 0;
}

.summary-main-breakdown strong {
  color: var(--gray-700);
  font-weight: 600;
}

.summary-main-divider {
  background: var(--gray-200);
  width: 1px;
}

/* =========================================================
   実績：ビル別カード
   ========================================================= */
.building-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 16px;
}

.building-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 12px;
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s;
}

.building-card:hover { box-shadow: var(--shadow-md); }

.building-card-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-700);
  margin-bottom: 12px;
  border-bottom: 1px solid var(--gray-100);
  padding-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ビル名左の縦アクセント（黄色系） */
.building-card-name::before {
  content: '';
  display: block;
  width: 3px;
  height: 14px;
  background: var(--amber-600);
  border-radius: 2px;
  flex-shrink: 0;
}

.building-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.building-stat-label {
  font-size: 11px;
  color: var(--gray-500);
  margin-bottom: 4px;
}

.building-stat-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--gray-900);
  letter-spacing: -.01em;
}

.building-stat-unit {
  font-size: 12px;
  color: var(--gray-500);
  font-weight: 500;
  margin-left: 3px;
}

/* =========================================================
   2×2 リストグリッド
   ========================================================= */
.list-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

/* =========================================================
   リストカード
   ========================================================= */
.list-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
}

.list-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--gray-100);
}

.list-card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--gray-800);
  display: flex;
  align-items: center;
  gap: 8px;
}

.list-card-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 22px;
  padding: 0 7px;
  border-radius: 11px;
  font-size: 12px;
  font-weight: 700;
}

.badge-amber { background: var(--amber-100); color: var(--amber-700); }
.badge-red   { background: var(--red-100);   color: var(--red-700); }
.badge-blue  { background: var(--blue-100);  color: var(--blue-700); }
.badge-gray  { background: var(--gray-100);  color: var(--gray-600); }

.list-card-link {
  font-size: 12px;
  color: var(--green-600);
  text-decoration: none;
  font-weight: 500;
  white-space: nowrap;
}

.list-card-link:hover { text-decoration: underline; }

/* =========================================================
   テーブル
   ========================================================= */
.list-table {
  width: 100%;
  border-collapse: collapse;
  flex: 1;
}

.list-table thead th {
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-400);
  text-transform: uppercase;
  letter-spacing: .05em;
  padding: 10px 16px;
  background: var(--gray-50);
  text-align: left;
  white-space: nowrap;
  border-bottom: 1px solid var(--gray-100);
}

.list-table tbody td {
  font-size: 13px;
  padding: 11px 16px;
  color: var(--gray-700);
  vertical-align: middle;
  border-bottom: 1px solid var(--gray-100);
  line-height: 1.4;
}

.list-table tbody tr:last-child td { border-bottom: none; }

.list-table tbody tr:hover td { background: var(--gray-50); }

/* セル修飾 */
.cell-primary   { font-weight: 600; color: var(--gray-800); }
.cell-secondary { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
.cell-date      { font-weight: 600; white-space: nowrap; }
.cell-date.urgent  { color: var(--red-600); }
.cell-date.warning { color: var(--amber-600); }

.detail-link {
  font-size: 12px;
  color: var(--green-600);
  text-decoration: none;
  font-weight: 500;
  white-space: nowrap;
}

.detail-link:hover { text-decoration: underline; }

/* =========================================================
   ステータスバッジ
   ========================================================= */
.status {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  white-space: nowrap;
}

.status-vacant      { background: var(--gray-100);  color: var(--gray-600); }
.status-negotiating { background: var(--amber-100); color: var(--amber-700); }
.status-follow      { background: var(--amber-100); color: var(--amber-700); }
.status-on_hold     { background: var(--blue-100);  color: var(--blue-700); }
.status-unreachable { background: var(--red-100);   color: var(--red-700); }
.status-planned     { background: var(--gray-100);  color: var(--gray-600); }
.status-in_progress { background: var(--green-100); color: var(--green-700); }
.status-recovering  { background: var(--blue-100);  color: var(--blue-700); }

/* 種別タグ */
.type-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
}

.type-repair  { background: var(--gray-100); color: var(--gray-600); }
.type-invest  { background: var(--sky-50);   color: var(--sky-600); border: 1px solid var(--blue-100); }

/* =========================================================
   空データ
   ========================================================= */
.empty-row td {
  text-align: center;
  padding: 32px;
  color: var(--gray-300);
  font-size: 13px;
}

/* =========================================================
   レスポンシブ
   ========================================================= */
@media (max-width: 1100px) {
  .kpi-grid  { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 880px) {
  .list-grid { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
  .page  { padding: 16px 12px 32px; }
  .page-title { font-size: 18px; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .kpi-number { font-size: 36px; }
}
</style>
</head>
<body>
<div class="page">

  <h1 class="page-title">テナントダッシュボード</h1>

  <!-- =========================================
       KPI 4枚
       ========================================= -->
  <div class="section">

    <!-- メインカード：全体合計 -->
    <div class="summary-main">
      <div class="summary-main-header">
        <span class="summary-main-badge">ビル合計</span>
      </div>
      <div class="summary-main-grid">
        <div class="summary-main-cell">
          <div class="summary-main-label">収入想定（2025年度）</div>
          <div>
            <span class="summary-main-value">38,950,000</span>
            <span class="summary-main-unit">円</span>
          </div>
          <div class="summary-main-breakdown">
            実績 <strong>35,700,000円</strong>（5〜3月）&nbsp;＋&nbsp;予想 <strong>3,250,000円</strong>（4月）
          </div>
        </div>
        <div class="summary-main-divider"></div>
        <div class="summary-main-cell">
          <div class="summary-main-label">入居率</div>
          <div>
            <span class="summary-main-value">87.5</span>
            <span class="summary-main-unit">%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 「実績」サブタイトル（全体カードとビル別カードの間） -->
    <div class="section-heading" style="margin-top: 40px;">
      <div class="section-accent teal"></div>
      <span class="section-label">3月実績</span>
      <div class="section-divider"></div>
    </div>

    <!-- ビル別カード -->
    <div class="building-grid">

      <div class="building-card">
        <div class="building-card-name">松山中央ビル</div>
        <div class="building-stats">
          <div>
            <div class="building-stat-label">収入</div>
            <div>
              <span class="building-stat-value">1,200,000</span>
              <span class="building-stat-unit">円</span>
            </div>
          </div>
          <div>
            <div class="building-stat-label">入居率</div>
            <div>
              <span class="building-stat-value">92.0</span>
              <span class="building-stat-unit">%</span>
            </div>
          </div>
        </div>
      </div>

      <div class="building-card">
        <div class="building-card-name">三津浜ビル</div>
        <div class="building-stats">
          <div>
            <div class="building-stat-label">収入</div>
            <div>
              <span class="building-stat-value">850,000</span>
              <span class="building-stat-unit">円</span>
            </div>
          </div>
          <div>
            <div class="building-stat-label">入居率</div>
            <div>
              <span class="building-stat-value">88.0</span>
              <span class="building-stat-unit">%</span>
            </div>
          </div>
        </div>
      </div>

      <div class="building-card">
        <div class="building-card-name">大街道ビル</div>
        <div class="building-stats">
          <div>
            <div class="building-stat-label">収入</div>
            <div>
              <span class="building-stat-value">750,000</span>
              <span class="building-stat-unit">円</span>
            </div>
          </div>
          <div>
            <div class="building-stat-label">入居率</div>
            <div>
              <span class="building-stat-value">85.0</span>
              <span class="building-stat-unit">%</span>
            </div>
          </div>
        </div>
      </div>

      <div class="building-card">
        <div class="building-card-name">道後ビル</div>
        <div class="building-stats">
          <div>
            <div class="building-stat-label">収入</div>
            <div>
              <span class="building-stat-value">450,000</span>
              <span class="building-stat-unit">円</span>
            </div>
          </div>
          <div>
            <div class="building-stat-label">入居率</div>
            <div>
              <span class="building-stat-value">84.0</span>
              <span class="building-stat-unit">%</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div><!-- /KPI -->


</div><!-- /.page -->
</body>
</html>
