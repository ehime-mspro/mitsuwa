<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>工程表ボード — 初期表示で年が見えるか</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #F3F4F6;
         font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #111827; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lead { font-size: 13px; color: #6B7280; margin: 0 0 18px; line-height: 1.75; }
  .ctl { display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
         background: white; border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; }
  .ctl label { font-size: 12.5px; color: #374151; display: flex; align-items: center; gap: 6px; }
  select { height: 32px; padding: 0 8px; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 13px; background: white; }
  .meta { font-size: 12px; color: #6B7280; margin: 0 0 22px; line-height: 1.7; }
  .meta b { color: #111827; }

  .card { margin-bottom: 26px; }
  .card > h2 { font-size: 14px; margin: 0 0 2px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 2px 7px; }
  .tag.rec { background: #ECFDF5; color: #047857; }
  .tag.alt { background: #F3F4F6; color: #4B5563; }
  .verdict { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px; }
  .verdict.ok { background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0; }
  .verdict.partial { background: #FFFBEB; color: #B45309; border: 1px solid #FDE68A; }
  .verdict.ng { background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }
  .card > p { font-size: 12px; color: #6B7280; margin: 0 0 8px; line-height: 1.65; }

  /* 画面の“窓”。ここから先はスクロールしないと見えない ＝ 初期表示そのもの */
  .viewport { border: 1px solid #E5E7EB; border-radius: 8px; overflow: hidden; background: white; position: relative; }
  .viewport::after { content: 'スクロールしないと見えない →'; position: absolute; right: 0; top: 0; bottom: 0; width: 150px;
                     background: linear-gradient(to right, rgba(255,255,255,0), rgba(243,244,246,.92) 65%);
                     font-size: 10px; color: #9CA3AF; display: flex; align-items: flex-end; justify-content: flex-end;
                     padding: 4px 6px; pointer-events: none; }
  /* 本物と同じ仕組み: overflow を持つスクロールコンテナに scrollLeft を入れる。
     overflow:hidden でも JS からの scrollLeft は効き、position:sticky も本物どおり働く。 */
  .clip { overflow: hidden; }

  .range { font-size: 11.5px; color: #4B5563; background: #F9FAFB; border-bottom: 1px solid #E5E7EB; padding: 6px 12px; }
  .range b { color: #111827; font-weight: 700; }

  .hrow { display: flex; height: 42px; background: #F9FAFB; border-bottom: 1px solid #E5E7EB; }
  .brow { display: flex; height: 46px; border-bottom: 1px solid #F3F4F6; }
  .lbl  { min-width: 0; overflow: hidden; border-right: 1px solid #E5E7EB;
          display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 12.5px;
          position: sticky; left: 0; z-index: 5; background: white;
          box-shadow: 6px 0 6px -6px rgba(0,0,0,.18); }
  .hrow .lbl { font-size: 11.5px; font-weight: 700; color: #6B7280; background: #F9FAFB; }
  .kind { font-size: 10px; font-weight: 700; color: #6B7280; background: #F3F4F6; border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
  .lbl a { color: #111827; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .axis { flex: 1 1 auto; min-width: 0; position: relative; display: flex; }
  .arow { flex: 1 1 auto; min-width: 0; position: relative; }
  .mcell { border-right: 1px solid #E5E7EB; font-size: 11px; color: #6B7280;
           display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; }
  .mcell.q { border-right-color: #D1D5DB; }
  .mcell i { font-style: normal; font-size: 9.5px; color: #9CA3AF; margin-right: 3px; }
  .bar { position: absolute; height: 13px; border-radius: 3px; }
  .today-line { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed #EF4444; z-index: 3; }
  .today-pill { position: absolute; top: 2px; transform: translateX(-50%); background: #EF4444; color: white;
                font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; white-space: nowrap; z-index: 4; }
</style>
</head>
<body>

<h1>工程表ボード — 初期表示で年が見えるか</h1>
<p class="lead">
  年の出し方は<b>案①（先頭セルと 1 月セルに前置き）</b>で決定済み。ここで見るのは
  「<b>スクロールしない状態で年が画面に入るか</b>」だけです。<br>
  下の枠は<b>画面の窓そのもの</b>で、右側のグレーから先はスクロールしないと見えません。
  ⚠ 1 ヶ月 = 150px 固定なので、画面幅を狭くすると見える月数が減ります。
</p>

<div class="ctl">
  <label>今日
    <select id="scen">
      <option value="A">2025-09-03（軸 2025-01 〜 2026-02 / 14 ヶ月）</option>
      <option value="B">2025-11-20（軸 2025-06 〜 2026-03 / 10 ヶ月）</option>
      <option value="C" selected>2026-09-04（軸 2026-02 〜 2026-09 / 8 ヶ月・現在の本番）</option>
      <option value="D">2026-03-10（軸 2025-11 〜 2026-10 / 12 ヶ月・年が画面外に出やすい）</option>
    </select>
  </label>
  <label>初期スクロール位置
    <select id="pos">
      <option value="prev">現在月の1ヶ月前を左端（ご要望）</option>
      <option value="today">今日を中央（いまの実装）</option>
    </select>
  </label>
  <label>画面幅
    <select id="vw">
      <option value="1440">PC 1440px（軸 約 1100px ≒ 7 ヶ月）</option>
      <option value="1280">ノート 1280px（軸 約 940px ≒ 6 ヶ月）</option>
      <option value="768">タブレット 768px（軸 約 410px ≒ 2.7 ヶ月）</option>
      <option value="375">スマホ 375px（軸 約 200px ≒ 1.3 ヶ月）</option>
    </select>
  </label>
</div>
<p class="meta" id="meta"></p>

<div id="out"></div>

<script>
const SCEN = {
  A: { from: '2025-01-01', to: '2026-02-28', today: '2025-09-03' },
  B: { from: '2025-06-01', to: '2026-03-31', today: '2025-11-20' },
  C: { from: '2026-02-01', to: '2026-09-30', today: '2026-09-04' },
  D: { from: '2025-11-01', to: '2026-10-31', today: '2026-03-10' },
};
// 軸の可視幅・ラベル幅は 2026-09-03 のローカル実測（375px で ラベル140 / 軸201）から起こした概算
const VW = { 1440: { axis: 1100, label: 320 }, 1280: { axis: 940, label: 320 },
             768: { axis: 410, label: 320 }, 375: { axis: 201, label: 140 } };
const MW = 150;

const CASES = [
  { kind: '建売', name: 'JG保免中3号地', bars: [[0,.35,'#059669'],[.30,.55,'#2563EB'],[.60,.95,'#059669']] },
  { kind: '分譲地', name: '大可賀プロジェクト', bars: [[.10,.70,'#7C3AED'],[.50,.88,'#059669']] },
];

const d = s => new Date(s + 'T00:00:00Z');
const days = (a, b) => Math.round((d(b) - d(a)) / 86400000);
const jp = s => +s.slice(0,4) + '年' + (+s.slice(5,7)) + '月';

function monthsIn(from, to) {
  const out = []; let y = +from.slice(0,4), m = +from.slice(5,7);
  const eY = +to.slice(0,4), eM = +to.slice(5,7);
  while (y < eY || (y === eY && m <= eM)) {
    out.push({ y, m, dim: new Date(Date.UTC(y, m, 0)).getUTCDate(),
               label: m + '月', year: String(y), strong: [1,4,7,10].includes(m) });
    m++; if (m > 12) { m = 1; y++; }
  }
  return out;
}

// everyMonth=false → 案①（先頭と1月だけ）/ true → 案⑨（毎月）
function build(sc, months, total, view, scrollLeft, everyMonth, showRange) {
  const trackPx = months.length * MW;
  const px = s => days(sc.from, s) / total * trackPx;      // 月エリア内の px
  const todayIn = d(sc.today) >= d(sc.from) && d(sc.today) <= d(sc.to);
  const visL = scrollLeft, visR = scrollLeft + view.axis;

  let yearSeen = false, cum = 0;
  let head = '';
  months.forEach((mo, i) => {
    const w = mo.dim / total * trackPx;
    const show = everyMonth || i === 0 || mo.m === 1;
    const center = cum + w / 2;
    if (show && center >= visL && center <= visR) yearSeen = true;
    head += '<div class="mcell' + (mo.strong ? ' q' : '') + '" style="width:' + w + 'px">'
          + (show ? '<i>' + mo.year + '</i>' : '') + mo.label + '</div>';
    cum += w;
  });

  const tp = todayIn ? px(sc.today) : null;
  if (tp !== null) head += '<div class="today-pill" style="left:' + tp + 'px">今日 '
    + (+sc.today.slice(5,7)) + '/' + (+sc.today.slice(8,10)) + '</div>';

  let rows = '';
  CASES.forEach(c => {
    let bars = tp !== null ? '<div class="today-line" style="left:' + tp + 'px"></div>' : '';
    c.bars.forEach((b, i) => bars += '<div class="bar" style="left:' + (b[0]*trackPx) + 'px; width:'
      + ((b[1]-b[0])*trackPx) + 'px; top:' + (8+i*17) + 'px; background:' + b[2] + '"></div>');
    rows += '<div class="brow"><div class="lbl" style="flex:0 0 ' + view.label + 'px">'
          + '<span style="color:#6B7280;font-size:12px;">▸</span><span class="kind">' + c.kind + '</span>'
          + '<a href="#">' + c.name + '</a></div><div class="arow">' + bars + '</div></div>';
  });

  const inner = '<div style="width:' + (view.label + trackPx) + 'px">'
    + '<div class="hrow"><div class="lbl" style="flex:0 0 ' + view.label + 'px">案件</div>'
    + '<div class="axis">' + head + '</div></div>' + rows + '</div>';

  const range = showRange
    ? '<div class="range">表示期間: <b>' + jp(sc.from) + ' 〜 ' + jp(sc.to) + '</b></div>' : '';

  const singleYear = months[0].y === months[months.length - 1].y;
  // ⚠ 期間テキストだけで済むのは軸が単年のときだけ。複数年だと「いま見ている月がどちらの年か」は
  //    範囲からの推測になるので △ にする（甘く ✅ にしない）
  const level = yearSeen ? 'ok' : (showRange ? (singleYear ? 'ok' : 'partial') : 'ng');
  return { html: '<div class="viewport" style="width:' + (view.label + view.axis) + 'px">'
                 + range + '<div class="clip" data-sl="' + scrollLeft + '">' + inner + '</div></div>',
           level: level };
}

function render() {
  const sc = SCEN[document.getElementById('scen').value];
  const view = VW[document.getElementById('vw').value];
  const mode = document.getElementById('pos').value;
  const months = monthsIn(sc.from, sc.to);
  const total = days(sc.from, sc.to) + 1;
  const trackPx = months.length * MW;
  const px = s => days(sc.from, s) / total * trackPx;

  // 前月の1日（軸の外なら軸の頭にはりつく）
  let py = +sc.today.slice(0,4), pm = +sc.today.slice(5,7) - 1;
  if (pm === 0) { pm = 12; py--; }
  const prev = py + '-' + String(pm).padStart(2,'0') + '-01';
  const raw = mode === 'prev'
    ? (d(prev) < d(sc.from) ? 0 : px(prev))
    : px(sc.today) - view.axis / 2;
  const sl = Math.max(0, Math.min(raw, Math.max(0, trackPx - view.axis)));

  document.getElementById('meta').innerHTML =
    '軸 <b>' + jp(sc.from) + ' 〜 ' + jp(sc.to) + '</b>（' + months.length + ' ヶ月 / トラック '
    + trackPx + 'px）　初期 scrollLeft = <b>' + Math.round(sl) + 'px</b>　'
    + (mode === 'prev' ? '左端に置く月: <b>' + jp(prev) + '</b>' : '中央に置く日: <b>' + sc.today + '</b>')
    + (sl === 0 && mode === 'prev' && d(prev) < d(sc.from) ? '（前月が軸の外なので先頭で止まる）' : '');

  const defs = [
    ['案①のまま（先頭と 1 月だけ）', 'rec', false, false,
     '決定した形。初期位置を固定しても、先頭セルか 1 月セルが窓に入らなければ年は出ない。'],
    ['案⑨ 毎月に年を前置き（1 行のまま）', 'alt', true, false,
     '案①と同じ 1 行・同じ書体で、出す頻度だけ毎月にする。<b>どこにスクロールしても必ず年が見える。</b>150px の枠に対し「2026 1月」は約 45px なのでスカスカのまま。'],
    ['案⑥ 案① ＋ ガントの上に期間を 1 行', 'alt', false, true,
     '軸の外に「表示期間: 2025年1月 〜 2026年2月」を常時表示。スクロールと無関係に必ず見える。<b>ただし答えるのは軸全体の範囲</b>で、複数年にまたがるときは「いま見ている月がどちらの年か」は分からない。'],
  ];

  document.getElementById('out').innerHTML = defs.map(function (dd) {
    const r = build(sc, months, total, view, sl, dd[2], dd[3]);
    return '<div class="card"><h2>' + dd[0] + ' <span class="tag ' + dd[1] + '">'
      + (dd[1] === 'rec' ? '決定済み' : '追加案') + '</span>'
      + '<span class="verdict ' + r.level + '">'
      + ({ ok: '✅ スクロールせずに年が分かる',
           partial: '△ 期間は出るが、見ている月の年は推測が要る',
           ng: '❌ 年が画面外' })[r.level] + '</span></h2>'
      + '<p>' + dd[4] + '</p>' + r.html + '</div>';
  }).join('');

  // ⚠ innerHTML を入れた**後**でないと scrollLeft は効かない（要素がまだ無い）
  document.querySelectorAll('.clip').forEach(function (el) {
    el.scrollLeft = parseFloat(el.dataset.sl) || 0;
  });
}

['scen','pos','vw'].forEach(function (id) {
  document.getElementById(id).addEventListener('change', render);
});
render();
</script>
</body>
</html>
