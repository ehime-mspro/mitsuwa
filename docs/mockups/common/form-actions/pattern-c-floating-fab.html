<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>案C 右下フローティングボタン — フォーム操作ボタン</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: "Hiragino Sans", "Yu Gothic UI", sans-serif; background: #f3f4f6; color: #1f2937; }
.app { display: flex; flex-direction: column; height: 100vh; }
.topbar { background: #047857; color: #fff; padding: 14px 24px; font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.main-wrap { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 240px; background: #fff; border-right: 1px solid #e5e7eb; padding: 20px 0; flex-shrink: 0; overflow-y: auto; }
.sidebar h3 { font-size: 12px; color: #059669; font-weight: 700; padding: 0 18px; margin: 16px 0 6px; }
.sidebar a { display: block; padding: 8px 18px; color: #4b5563; font-size: 14px; text-decoration: none; }
.sidebar a:hover { background: #f3f4f6; }
.sidebar a.active { background: #d1fae5; color: #047857; font-weight: 600; }
.main { flex: 1; overflow-y: auto; background: #f3f4f6; padding: 28px 32px 32px; position: relative; }
.breadcrumb { font-size: 13px; color: #6b7280; margin-bottom: 12px; }
.page-title { font-size: 20px; font-weight: 700; margin: 0 0 20px; }
.card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px 22px; margin-bottom: 18px; }
.card-title { font-size: 14px; font-weight: 700; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; color: #1f2937; background: #fff; }
.field textarea { min-height: 80px; resize: vertical; }

/* ★ 案C: フローティング FAB */
.fab-group {
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: stretch;
}
.fab {
  padding: 14px 24px;
  border: none;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 160px;
  transition: transform .12s ease, box-shadow .12s ease;
}
.fab-primary {
  background: #059669;
  color: #fff;
  box-shadow: 0 8px 24px rgba(5,150,105,0.35);
}
.fab-primary:hover { background: #047857; transform: translateY(-1px); }
.fab-cancel {
  background: #fff;
  color: #4b5563;
  border: 1px solid #d1d5db;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
.fab-cancel:hover { background: #f9fafb; }
.fab-danger {
  background: #fff;
  color: #dc2626;
  border: 1px solid #fecaca;
  box-shadow: 0 4px 16px rgba(220,38,38,0.15);
}
.fab-danger:hover { background: #fef2f2; }

.callout { background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #047857; margin-bottom: 18px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><span>🏠 ミツワ都市開発 — モック</span><span style="font-size: 13px; opacity: 0.9;">案C: フローティング FAB</span></div>
  <div class="main-wrap">
    <aside class="sidebar">
      <h3>住宅事業</h3>
      <a href="#">建売物件一覧</a>
      <a href="#" class="active">建売物件 編集</a>
      <a href="#">注文住宅一覧</a>
      <h3>不動産</h3>
      <a href="#">仕入れ案件</a>
      <a href="#">分譲地PJ</a>
    </aside>
    <main class="main">
      <div class="breadcrumb">ホーム › 住宅事業 › 建売物件 › 編集</div>
      <h1 class="page-title">建売物件編集（案C: フローティング FAB）</h1>
      <div class="callout">⬇ ⬇ ⬇ 画面右下に常にボタンが浮いているスタイル。</div>

      <div class="card">
        <div class="card-title">基本情報</div>
        <div class="grid2">
          <div class="field"><label>物件名</label><input value="JG西長戸4号地"></div>
          <div class="field"><label>進捗</label><select><option>建築中</option></select></div>
          <div class="field"><label>所在地</label><input value="愛媛県松山市..."></div>
          <div class="field"><label>構造</label><input value="木造2階建"></div>
          <div class="field"><label>土地面積（㎡）</label><input value="120.24"></div>
          <div class="field"><label>建物面積（㎡）</label><input value="92.74"></div>
          <div class="field"><label>完成予定日</label><input type="date"></div>
          <div class="field"><label>実際の完成日</label><input type="date"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">土地紐付け</div>
        <div class="grid2">
          <div class="field"><label>紐付け元</label><select><option>分譲地区画</option></select></div>
          <div class="field"><label>分譲地</label><select><option>松山JG西長戸</option></select></div>
        </div>
        <div class="field"><label>区画</label><select><option>4号地</option></select></div>
      </div>

      <div class="card">
        <div class="card-title">価格・原価情報</div>
        <div class="grid2">
          <div class="field"><label>土地原価（円）</label><input value="6,400,000"></div>
          <div class="field"><label>建物原価（円）</label><input value="18,270,983"></div>
          <div class="field"><label>建物予定販売価格（円）</label><input value="24,000,000"></div>
          <div class="field"><label>消費税率（%）</label><input value="10"></div>
        </div>
        <div class="field"><label>備考</label><textarea>建物原価には付帯工事費・諸経費を含む</textarea></div>
      </div>

      <div class="card">
        <div class="card-title">追加情報</div>
        <div class="field"><label>商品仕様</label><textarea></textarea></div>
        <div class="field"><label>営業メモ</label><textarea></textarea></div>
        <div class="field"><label>顧客への提案ポイント</label><textarea></textarea></div>
      </div>

      <div class="card">
        <div class="card-title">追加情報 2</div>
        <div class="grid2">
          <div class="field"><label>仕入先</label><input></div>
          <div class="field"><label>担当者</label><input></div>
          <div class="field"><label>連絡先</label><input></div>
          <div class="field"><label>備考</label><input></div>
        </div>
        <div class="field"><label>長文備考</label><textarea style="min-height: 120px;"></textarea></div>
      </div>

      <!-- 通常のフッタースペース確保 -->
      <div style="height: 80px;"></div>
    </main>
  </div>
</div>

<!-- ★ 案C: フローティング FAB -->
<div class="fab-group">
  <button class="fab fab-primary">✓ 更新する</button>
  <a class="fab fab-cancel" href="#">キャンセル</a>
  <button class="fab fab-danger">削除</button>
</div>
</body>
</html>
