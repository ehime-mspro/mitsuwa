<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マンション部屋編集 | ミツワ都市開発 経営管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; background: #f3f4f6; }
    </style>
</head>
<body>

    <!-- トップバー -->
    <header style="background: #1f2937; color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 16px;">
            <span style="font-weight: 700;">ミツワ都市開発 経営管理システム</span>
        </div>
        <div style="font-size: 13px;">山田 (経営層)</div>
    </header>

    <div style="display: flex; min-height: calc(100vh - 48px);">
        <!-- サイドバー -->
        <aside style="width: 220px; background: white; border-right: 1px solid #e5e7eb; padding: 16px 0;">
            <nav style="font-size: 13px;">
                <div style="padding: 8px 16px; color: #6b7280;">ダッシュボード</div>
                <div style="padding: 8px 16px; color: #6b7280;">テナント管理</div>
                <div style="padding: 8px 16px; color: #6b7280;">賃貸マンション ▾</div>
                <div style="padding: 6px 16px 6px 32px; background: #ecfdf5; color: #047857; border-left: 3px solid #10b981; font-weight: 600;">物件一覧</div>
                <div style="padding: 6px 16px 6px 32px; color: #6b7280;">入居者管理</div>
                <div style="padding: 6px 16px 6px 32px; color: #6b7280;">契約一覧</div>
                <div style="padding: 8px 16px; color: #6b7280;">不動産管理</div>
                <div style="padding: 8px 16px; color: #6b7280;">住宅事業</div>
                <div style="padding: 8px 16px; color: #6b7280;">システム管理</div>
            </nav>
        </aside>

        <!-- メインコンテンツ -->
        <main style="flex: 1; padding: 24px;">

            <!-- パンくず -->
            <div class="text-sm text-gray-500" style="margin-bottom: 12px;">
                ダッシュボード &gt; 賃貸マンション &gt; <a href="../properties/index.html" class="text-gray-500 hover:text-emerald-600 hover:underline">物件一覧</a> &gt; <a href="../properties/show.html" class="text-gray-500 hover:text-emerald-600 hover:underline">MS-001</a> &gt; <span class="text-gray-800 font-medium">501号室 編集</span>
            </div>

            <!-- ページヘッダー -->
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <h1 style="font-size: 20px; font-weight: 700; margin: 0;">部屋 編集</h1>
                    <span style="font-size: 12px; background: #f3f4f6; color: #4b5563; padding: 3px 10px; border-radius: 4px; font-weight: 600;">ミツワハイツ松山1号館 / 501号室</span>
                </div>
                <a href="../properties/show.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 6px; background: white; font-size: 13px; color: #374151; text-decoration: none;">
                    <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    物件詳細に戻る
                </a>
            </div>

            <!-- フォーム -->
            <form>

                <!-- ========== カード: 基本情報 ========== -->
                <div class="bg-white border border-gray-200 rounded-lg p-5" style="margin-bottom: 20px;">
                    <div style="font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 14px; padding-left: 12px; border-left: 4px solid #10b981;">
                        基本情報
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; margin-bottom: 26px;">
                        <!-- 号室番号 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">号室番号<span class="text-red-600" style="margin-left: 2px;">*</span></label>
                            <input type="text" name="room_number" value="501"
                                   style="width: 100%; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px;">
                        </div>
                        <!-- 階数 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">階数</label>
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <input type="number" name="floor" value="5" min="1" max="50"
                                       style="flex: 1; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px;">
                                <span style="font-size: 13px; color: #6b7280;">階</span>
                            </div>
                        </div>
                        <!-- 間取り -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">間取り</label>
                            <select name="room_type"
                                    style="width: 100%; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px;">
                                <option value="">選択してください</option>
                                <option>1R</option>
                                <option>1K</option>
                                <option>1DK</option>
                                <option>1LDK</option>
                                <option>2K</option>
                                <option>2DK</option>
                                <option selected>2LDK</option>
                                <option>3K</option>
                                <option>3DK</option>
                                <option>3LDK</option>
                                <option>4LDK</option>
                                <option>その他</option>
                            </select>
                        </div>
                        <!-- 専有面積 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">専有面積</label>
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <input type="number" name="area_sqm" value="55.20" step="0.01" min="0"
                                       style="flex: 1; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px;">
                                <span style="font-size: 13px; color: #6b7280;">㎡</span>
                            </div>
                        </div>
                    </div>

                    <!-- ステータス -->
                    <div style="margin-bottom: 0;">
                        <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">ステータス<span class="text-red-600" style="margin-left: 2px;">*</span></label>
                        <div style="display: flex; gap: 20px; padding: 4px 0; flex-wrap: wrap;">
                            <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #374151; cursor: pointer;">
                                <input type="radio" name="status" value="vacant" style="width: 16px; height: 16px; accent-color: #059669;">
                                空室
                            </label>
                            <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #374151; cursor: pointer;">
                                <input type="radio" name="status" value="occupied" checked style="width: 16px; height: 16px; accent-color: #059669;">
                                入居中
                            </label>
                            <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #374151; cursor: pointer;">
                                <input type="radio" name="status" value="negotiating" style="width: 16px; height: 16px; accent-color: #059669;">
                                申込み・仮押え
                            </label>
                            <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #374151; cursor: pointer;">
                                <input type="radio" name="status" value="move_out_planned" style="width: 16px; height: 16px; accent-color: #059669;">
                                退去予定
                            </label>
                        </div>
                        <div style="font-size: 11px; color: #6b7280; margin-top: 3px;">※ ステータスは契約登録・解約時に自動で更新されます。手動変更は特別な場合のみ。</div>
                    </div>
                </div>

                <!-- ========== カード: 募集条件 ========== -->
                <div class="bg-white border border-gray-200 rounded-lg p-5" style="margin-bottom: 20px;">
                    <div style="font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 14px; padding-left: 12px; border-left: 4px solid #10b981;">
                        募集条件
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; margin-bottom: 0;">
                        <!-- 募集賃料 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">募集賃料</label>
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <input type="number" name="rent" value="85000" min="0" step="1000"
                                       style="flex: 1; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px; text-align: right;">
                                <span style="font-size: 13px; color: #6b7280;">円</span>
                            </div>
                            <div style="font-size: 11px; color: #6b7280; margin-top: 3px;">※ 税抜</div>
                        </div>
                        <!-- 共益費 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">共益費</label>
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <input type="number" name="common_fee" value="5000" min="0" step="1000"
                                       style="flex: 1; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px; text-align: right;">
                                <span style="font-size: 13px; color: #6b7280;">円</span>
                            </div>
                        </div>
                        <!-- 敷金 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">敷金</label>
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <input type="number" name="deposit" value="85000" min="0" step="1000"
                                       style="flex: 1; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px; text-align: right;">
                                <span style="font-size: 13px; color: #6b7280;">円</span>
                            </div>
                        </div>
                        <!-- 礼金 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">礼金</label>
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <input type="number" name="key_money" value="85000" min="0" step="1000"
                                       style="flex: 1; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px; text-align: right;">
                                <span style="font-size: 13px; color: #6b7280;">円</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ========== カード: 備考 ========== -->
                <div class="bg-white border border-gray-200 rounded-lg p-5" style="margin-bottom: 20px;">
                    <div style="font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 14px; padding-left: 12px; border-left: 4px solid #10b981;">
                        備考
                    </div>
                    <div>
                        <textarea name="notes" placeholder="設備や注意事項（例: バルコニー南向き、宅配ボックスあり等）..."
                                  style="width: 100%; min-height: 96px; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 12px; font-size: 14px; resize: vertical;">南東角部屋。ベランダから松山城が見える。追い焚き機能付き。</textarea>
                    </div>
                </div>

                <!-- アクションボタン -->
                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <a href="../properties/show.html" style="display: inline-flex; align-items: center; padding: 10px 20px; border: 1px solid #d1d5db; border-radius: 6px; background: white; font-size: 14px; color: #374151; text-decoration: none;">キャンセル</a>
                    <button type="submit" style="padding: 10px 24px; background: #059669; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;">
                        更新する
                    </button>
                </div>
            </form>

            <!-- 削除ゾーン -->
            <div class="bg-white border border-red-200 rounded-lg" style="margin-top: 28px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <div style="font-size: 14px; font-weight: 700; color: #b91c1c; margin-bottom: 2px;">部屋を削除</div>
                    <div style="font-size: 12px; color: #6b7280;">入居中・申込み・退去予定の部屋は削除できません。契約履歴がある場合も削除は推奨されません。</div>
                </div>
                <button type="button"
                        style="padding: 8px 20px; border: 1px solid #dc2626; border-radius: 6px; background: white; color: #dc2626; font-size: 13px; font-weight: 600; cursor: pointer;">
                    削除する
                </button>
            </div>

        </main>
    </div>

    <script>
        <!-- fullwidth-to-halfwidth-digit-normalizer -->
        // 数値入力欄（inputmode="numeric" / type="number"）の全角数字を自動で半角に変換
        document.addEventListener('input', function (e) {
            const t = e.target;
            if (!t || !t.matches) return;
            if (!t.matches('input[inputmode="numeric"], input[type="number"]')) return;
            const v = t.value;
            const nv = v.replace(/[０-９]/g, function (c) {
                return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
            });
            if (nv !== v) {
                const start = t.selectionStart;
                const end = t.selectionEnd;
                t.value = nv;
                try { t.setSelectionRange(start, end); } catch (_) {}
            }
        }, true);
    </script>

</body>
</html>
