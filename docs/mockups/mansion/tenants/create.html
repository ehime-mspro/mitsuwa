<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マンション入居者登録 | ミツワ都市開発 経営管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; background: #f3f4f6; }
    </style>
</head>
<body>

    <!-- トップバー -->
    <header style="background: #1f2937; color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 16px;">
            <span style="font-weight: 700;">ミツワ都市開発 経営管理システム</span>
        </div>
        <div style="font-size: 13px;">山田 (経営層)</div>
    </header>

    <div style="display: flex; min-height: calc(100vh - 48px);">
        <!-- サイドバー -->
        <aside style="width: 220px; background: white; border-right: 1px solid #e5e7eb; padding: 16px 0;">
            <nav style="font-size: 13px;">
                <div style="padding: 8px 16px; color: #6b7280;">ダッシュボード</div>
                <div style="padding: 8px 16px; color: #6b7280;">テナント管理</div>
                <div style="padding: 8px 16px; color: #6b7280;">賃貸マンション ▾</div>
                <div style="padding: 6px 16px 6px 32px; color: #6b7280;">物件一覧</div>
                <div style="padding: 6px 16px 6px 32px; background: #ecfdf5; color: #047857; border-left: 3px solid #10b981; font-weight: 600;">入居者管理</div>
                <div style="padding: 6px 16px 6px 32px; color: #6b7280;">契約一覧</div>
                <div style="padding: 8px 16px; color: #6b7280;">不動産管理</div>
                <div style="padding: 8px 16px; color: #6b7280;">住宅事業</div>
                <div style="padding: 8px 16px; color: #6b7280;">システム管理</div>
            </nav>
        </aside>

        <!-- メインコンテンツ -->
        <main style="flex: 1; padding: 24px;">

            <!-- パンくず -->
            <div class="text-sm text-gray-500" style="margin-bottom: 12px;">
                ダッシュボード &gt; 賃貸マンション &gt; <a href="index.html" class="text-gray-500 hover:text-emerald-600 hover:underline">入居者管理</a> &gt; <span class="text-gray-800 font-medium">新規登録</span>
            </div>

            <!-- ページヘッダー -->
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                <h1 style="font-size: 20px; font-weight: 700; margin: 0;">入居者 新規登録</h1>
                <a href="index.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 6px; background: white; font-size: 13px; color: #374151; text-decoration: none;">
                    <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    一覧に戻る
                </a>
            </div>

            <!-- フォーム -->
            <form>

                <!-- ========== カード: 利用者区分 ========== -->
                <div class="bg-white border border-gray-200 rounded-lg p-5" style="margin-bottom: 20px;">
                    <div style="font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 14px; padding-left: 12px; border-left: 4px solid #10b981;">
                        利用者区分
                    </div>
                    <div style="display: flex; gap: 20px; padding: 4px 0; flex-wrap: wrap;">
                        <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #374151; cursor: pointer;">
                            <input type="radio" name="tenant_type" value="resident" checked style="width: 16px; height: 16px; accent-color: #059669;">
                            入居者（部屋契約あり）
                        </label>
                        <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #374151; cursor: pointer;">
                            <input type="radio" name="tenant_type" value="parking_only" style="width: 16px; height: 16px; accent-color: #059669;">
                            駐車場利用のみ（外部利用者）
                        </label>
                    </div>
                    <div style="font-size: 12px; color: #6b7280; margin-top: 8px;">
                        ※「駐車場利用のみ」は部屋契約を持たず、駐車場だけを利用する外部利用者です。登録後の契約作成時に違いが出ます。
                    </div>
                </div>

                <!-- ========== カード: 基本情報 ========== -->
                <div class="bg-white border border-gray-200 rounded-lg p-5" style="margin-bottom: 20px;">
                    <div style="font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 14px; padding-left: 12px; border-left: 4px solid #10b981;">
                        基本情報
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <!-- 氏名 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">氏名<span class="text-red-600" style="margin-left: 2px;">*</span></label>
                            <input type="text" name="name" placeholder="例: 佐藤 健一"
                                   style="width: 100%; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px;">
                        </div>
                        <!-- 電話 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">電話番号</label>
                            <input type="tel" name="phone" placeholder="例: 090-1234-5678"
                                   style="width: 100%; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px;">
                        </div>
                        <!-- メール -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">メールアドレス</label>
                            <input type="email" name="email" placeholder="例: sato@example.com"
                                   style="width: 100%; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px;">
                        </div>
                        <!-- 勤務先 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">勤務先</label>
                            <input type="text" name="workplace" placeholder="例: 愛媛トヨタ自動車㈱"
                                   style="width: 100%; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px;">
                        </div>
                    </div>
                </div>

                <!-- ========== カード: 緊急連絡先 ========== -->
                <div class="bg-white border border-gray-200 rounded-lg p-5" style="margin-bottom: 20px;">
                    <div style="font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 14px; padding-left: 12px; border-left: 4px solid #10b981;">
                        緊急連絡先
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
                        <!-- 氏名 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">氏名</label>
                            <input type="text" name="emergency_contact_name" placeholder="例: 佐藤 恵美子"
                                   style="width: 100%; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px;">
                        </div>
                        <!-- 電話 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">電話番号</label>
                            <input type="tel" name="emergency_contact_phone" placeholder="例: 089-123-4567"
                                   style="width: 100%; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px;">
                        </div>
                        <!-- 続柄 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700" style="margin-bottom: 5px;">続柄</label>
                            <input type="text" name="emergency_contact_relation" placeholder="例: 母、配偶者、兄弟など"
                                   style="width: 100%; height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 14px;">
                        </div>
                    </div>
                </div>

                <!-- ========== カード: 備考 ========== -->
                <div class="bg-white border border-gray-200 rounded-lg p-5" style="margin-bottom: 20px;">
                    <div style="font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 14px; padding-left: 12px; border-left: 4px solid #10b981;">
                        備考
                    </div>
                    <div>
                        <textarea name="notes" placeholder="ペット飼育の有無・入居時の要望・その他注意事項など..."
                                  style="width: 100%; min-height: 96px; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 12px; font-size: 14px; resize: vertical;"></textarea>
                    </div>
                </div>

                <!-- アクションボタン -->
                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <a href="index.html" style="display: inline-flex; align-items: center; padding: 10px 20px; border: 1px solid #d1d5db; border-radius: 6px; background: white; font-size: 14px; color: #374151; text-decoration: none;">キャンセル</a>
                    <button type="submit" style="padding: 10px 24px; background: #059669; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;">
                        登録する
                    </button>
                </div>
            </form>

            <!-- 補足 -->
            <div style="margin-top: 20px; padding: 12px 16px; background: #f9fafb; border-radius: 8px; font-size: 12px; color: #6b7280;">
                <strong style="color: #374151;">※登録後の動作</strong>：入居者を登録後、契約画面で部屋または駐車場を紐付けます。登録完了後は一覧画面に戻ります。
            </div>

        </main>
    </div>

</body>
</html>
